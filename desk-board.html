<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#15191b;
    --ink2:#4a5459;
    --ink3:#7d8a8d;
    --ground:#d9ded8;
    --card:#f8f9f6;
    --rule:#b6bfb6;
    --brick:#b23a2e;
    --pine:#2c6b5e;
    --slate:#23404f;
    --amber:#a8760f;
    --indigo:#3a3466;
    --ultra:#1f5f8b;
    --moss:#6d7a3f;
    --plum:#733a56;
    --tint2:#e7eded;
    --edge2:#b0c0c2;
    --tint3:#f3d7d1;
    --edge3:#c9948a;
    --display:'Archivo Narrow',"Helvetica Neue Condensed",Impact,sans-serif;
    --body:'IBM Plex Sans',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  #app{
    font-family:var(--body);
    color:var(--ink);
    background:var(--ground);
    background-image:linear-gradient(var(--rule) 1px,transparent 1px);
    background-size:100% 28px;
    padding:18px;
    min-height:100%;
  }
  button{font-family:var(--body);cursor:pointer}
  input,select{font-family:var(--body);font-size:14px}
  :focus-visible{outline:2px solid var(--slate);outline-offset:2px}

  /* ---- header ---- */
  .board-head{
    display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;
    border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:6px;
  }
  .wordmark{
    font-family:var(--display);font-weight:700;font-size:34px;line-height:.85;
    letter-spacing:.01em;text-transform:uppercase;margin:0;
  }
  .wordmark small{display:block;font-family:var(--mono);font-size:10px;font-weight:400;
    letter-spacing:.16em;color:var(--ink2);margin-top:6px}
  .gauges{display:flex;gap:20px;margin-left:auto;flex-wrap:wrap}
  .gauge{font-family:var(--mono);text-align:right}
  .gauge b{display:block;font-size:24px;font-weight:600;line-height:1}
  .gauge span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
  .gauge.hot b{color:var(--brick)}
  .gauge.warm b{color:var(--amber)}

  /* ---- page tabs ---- */
  .tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid var(--rule)}
  .tabs button{
    border:0;background:transparent;padding:8px 15px 7px;margin-bottom:-1px;
    font-family:var(--display);font-weight:700;text-transform:uppercase;
    letter-spacing:.07em;font-size:14px;color:var(--ink3);border-bottom:3px solid transparent;
  }
  .tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
  .tabs button:hover{color:var(--ink2)}
  .tabs .tally-note{margin-left:auto;align-self:center;font-family:var(--mono);
    font-size:10px;color:var(--ink3);letter-spacing:.05em;padding-right:2px}

  /* ---- intake ---- */
  form.intake{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    background:var(--card);border:1px solid var(--ink);padding:10px;margin-bottom:14px;
  }
  form.intake input[type=text]{
    flex:1 1 200px;min-width:0;border:0;border-bottom:1px solid var(--rule);
    background:transparent;padding:7px 2px;font-size:15px;color:var(--ink);
  }
  form.intake input[type=text]::placeholder{color:var(--ink3)}
  form.intake select,form.intake input[type=date]{
    border:1px solid var(--rule);background:#fff;padding:6px 7px;color:var(--ink);
    font-family:var(--mono);font-size:12px;
  }
  .file-btn{
    border:0;background:var(--ink);color:var(--card);
    font-family:var(--display);font-weight:700;text-transform:uppercase;
    letter-spacing:.08em;font-size:14px;padding:9px 18px;
  }
  .file-btn:hover{background:var(--slate)}

  .toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px;
    font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink2)}
  .toolbar button{
    border:1px solid var(--rule);background:transparent;color:var(--ink2);
    font-family:var(--mono);font-size:11px;padding:4px 9px;letter-spacing:.06em;
  }
  .toolbar button[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}

  /* ---- importance dots ---- */
  .imp{display:inline-flex;gap:3px;align-items:center;flex:0 0 auto;margin-top:5px}
  .imp i{display:block;width:5.5px;height:5.5px;border-radius:50%;border:1px solid var(--ink3)}
  .imp.l1 i.on{background:var(--ink3);border-color:var(--ink3)}
  .imp.l2 i.on{background:var(--slate);border-color:var(--slate)}
  .imp.l3 i.on{background:var(--brick);border-color:var(--brick)}

  /* ---- lanes ---- */
  .lanes{display:grid;grid-template-columns:repeat(8,minmax(124px,1fr));
    gap:8px;align-items:start;overflow-x:auto;padding-bottom:6px}
  .lane{background:rgba(248,249,246,.55);border-top:3px solid var(--ink);padding:7px 6px 10px;min-width:0}
  .lane[data-lane=URGENT]{border-top-color:var(--brick)}
  .lane[data-lane=EARNINGS]{border-top-color:var(--amber)}
  .lane[data-lane=QUICK]{border-top-color:var(--pine)}
  .lane[data-lane=DEEP]{border-top-color:var(--slate)}
  .lane[data-lane=DEEPER]{border-top-color:var(--indigo)}
  .lane[data-lane=MODEL]{border-top-color:var(--ultra)}
  .lane[data-lane=PROCESS]{border-top-color:var(--plum)}
  .lane[data-lane=OTHER]{border-top-color:var(--ink3)}
  .lane-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px;margin-bottom:8px}
  .lane-head h2{font-family:var(--display);font-weight:700;text-transform:uppercase;
    font-size:12.5px;letter-spacing:.04em;margin:0;line-height:1.1}
  .lane-head em{display:block;font-family:var(--body);font-style:normal;font-size:9.5px;
    color:var(--ink2);letter-spacing:0;text-transform:none;font-weight:400;margin-top:2px;line-height:1.25}
  .lane-head .n{font-family:var(--mono);font-size:11px;color:var(--ink3)}
  .lane-empty{font-size:11px;color:var(--ink3);padding:3px 1px 1px}
  @media (max-width:560px){
    .lanes{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));overflow-x:visible}
    .lane-head h2{font-size:15px}
    .lane-head em{font-size:11px}
  }

  /* ---- task card ----
     Background = importance (how much it matters).
     Left edge  = deadline state (how soon it bites). Two signals, two channels. */
  .task{background:var(--card);border:1px solid var(--rule);padding:7px 8px 7px;margin-bottom:7px}
  .task.imp2{background:var(--tint2);border-color:var(--edge2)}
  .task.imp3{background:var(--tint3);border:1.5px solid var(--edge3);
    box-shadow:0 1px 0 rgba(178,58,46,.18)}
  .task.late{border-left:4px solid var(--brick)}
  .task.today{border-left:4px solid var(--amber)}
  .task.done{opacity:.42}
  .task-top{display:flex;gap:6px;align-items:flex-start}
  .check{
    flex:0 0 auto;width:15px;height:15px;margin-top:2px;border:1.5px solid var(--ink2);
    background:#fff;padding:0;font-family:var(--mono);font-size:11px;line-height:1;color:var(--pine);
  }
  .task h3{margin:0;font-size:13px;font-weight:500;line-height:1.3;flex:1;min-width:0;
    overflow-wrap:break-word}
  .task.imp3 h3{font-weight:600}
  .task.done h3{text-decoration:line-through}
  .kill{flex:0 0 auto;border:0;background:transparent;color:var(--ink3);font-size:14px;line-height:1;padding:0 1px}
  .kill:hover{color:var(--brick)}

  /* tally = age since assigned */
  .tally{display:flex;align-items:flex-end;gap:2px;height:13px;margin:7px 0 4px;overflow:hidden}
  .tally i{display:block;width:1.5px;background:var(--ink2)}
  .tally i.week{background:var(--brick);width:2px}
  .tally .over{font-family:var(--mono);font-size:9px;color:var(--brick);
    letter-spacing:.04em;align-self:center;margin-left:3px}
  .tally .fresh{font-family:var(--mono);font-size:9px;color:var(--ink3);letter-spacing:.05em;align-self:center}

  .readout{display:flex;justify-content:space-between;align-items:baseline;gap:5px;
    font-family:var(--mono);font-size:8.5px;letter-spacing:.02em;color:var(--ink2);white-space:nowrap}
  .readout span{overflow:hidden;text-overflow:ellipsis}
  .readout .due.late{color:var(--brick);font-weight:600}
  .readout .due.soon{color:var(--amber);font-weight:600}
  .readout .due.none{color:var(--ink3)}

  /* rail = deadline consumption */
  .rail{position:relative;height:3px;background:var(--rule);margin:7px 0 8px}
  .rail span{position:absolute;left:0;top:0;bottom:0;background:var(--slate)}
  .rail.late span{background:var(--brick)}
  .rail.soon span{background:var(--amber)}
  .rail.open{background:transparent;border-top:1.5px dashed var(--rule);height:0}

  .move{display:flex;gap:4px;align-items:stretch}
  .move select{
    border:1px solid var(--rule);background:transparent;color:var(--ink3);
    font-family:var(--mono);font-size:9px;letter-spacing:.02em;padding:2px 1px 2px 3px;
  }
  .move select.lane{flex:1 1 auto;min-width:0}
  .move select.lvl{flex:0 0 34px;text-align:center}
  .move select:hover{border-color:var(--ink);color:var(--ink)}

  /* ---- recurring page: a schedule, not a pile ---- */
  .sched{max-width:820px}
  .sched-group{margin-bottom:22px}
  .sched-group > h2{
    font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:15px;
    letter-spacing:.08em;margin:0 0 2px;padding-bottom:5px;border-bottom:2px solid var(--ink);
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .sched-group > h2 span{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--ink3)}
  .rec{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    background:var(--card);border-bottom:1px solid var(--rule);padding:9px 10px;
  }
  .rec.imp2{background:var(--tint2);border-bottom-color:var(--edge2)}
  .rec.imp3{background:var(--tint3);border-bottom-color:var(--edge3)}
  .rec.imp3 h3{font-weight:600}
  .rec.late{border-left:4px solid var(--brick)}
  .rec.soon{border-left:4px solid var(--amber)}
  .rec-name{flex:1 1 190px;min-width:0}
  .rec-name h3{margin:0;font-size:14.5px;font-weight:500;line-height:1.3}
  .rec-name .imp{margin:5px 0 0}
  .rec-when{flex:0 0 auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;
    color:var(--ink2);text-align:right;min-width:132px}
  .rec-when b{display:block;font-size:12px;font-weight:600}
  .rec-when b.late{color:var(--brick)}
  .rec-when b.soon{color:var(--amber)}
  .rec-log{flex:0 0 auto;font-family:var(--mono);font-size:9.5px;color:var(--ink3);
    letter-spacing:.04em;min-width:112px}
  .rec-acts{display:flex;gap:5px;flex:0 0 auto}
  .rec-acts button{
    border:1px solid var(--rule);background:transparent;color:var(--ink2);
    font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;padding:4px 7px;
  }
  .rec-acts button.primary{background:var(--ink);color:var(--card);border-color:var(--ink)}
  .rec-acts button:hover{border-color:var(--ink);color:var(--ink)}
  .rec-acts button.primary:hover{background:var(--slate);color:var(--card)}
  .rec-acts button.kill{border:0;color:var(--ink3);font-size:15px;padding:1px 3px}
  .rec-acts button.kill:hover{color:var(--brick)}

  .footnote{font-family:var(--mono);font-size:10px;color:var(--ink3);
    margin-top:18px;border-top:1px solid var(--rule);padding-top:8px;letter-spacing:.04em}
  [hidden]{display:none !important}
  @media (max-width:520px){
    .wordmark{font-size:27px}
    .gauges{margin-left:0;gap:16px}
    .rec-when{text-align:left;min-width:0}
  }
  @media (prefers-reduced-motion:no-preference){
    .task{transition:border-color .18s}
  }
</style>

<div id="app">
  <header class="board-head">
    <h1 class="wordmark">Desk Board<small id="stamp"></small></h1>
    <div class="gauges" id="gauges"></div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-view="board" aria-selected="true">Board</button>
    <button role="tab" data-view="recurring" aria-selected="false">Recurring</button>
    <span class="tally-note" id="tabnote"></span>
  </nav>

  <!-- ============ BOARD ============ -->
  <div id="page-board">
    <form class="intake" id="intake" autocomplete="off">
      <input type="text" id="f-title" placeholder="What's the task?" required maxlength="140">
      <select id="f-lane" aria-label="Category"></select>
      <select id="f-imp" aria-label="Importance">
        <option value="3">Importance 3</option>
        <option value="2" selected>Importance 2</option>
        <option value="1">Importance 1</option>
      </select>
      <input type="date" id="f-due" aria-label="Deadline">
      <button type="submit" class="file-btn">Add</button>
    </form>

    <div class="toolbar">
      <span>Order</span>
      <button data-sort="heat" aria-pressed="true">Pressure</button>
      <button data-sort="due" aria-pressed="false">Deadline</button>
      <button data-sort="age" aria-pressed="false">Oldest</button>
      <button data-sort="imp" aria-pressed="false">Importance</button>
      <button id="t-done" aria-pressed="false" style="margin-left:auto">Show finished</button>
      <button id="b-export">Export</button>
      <button id="b-import">Import</button>
      <input type="file" id="f-import" accept=".json,application/json" style="display:none">
    </div>

    <div class="lanes" id="lanes"></div>
  </div>

  <!-- ============ RECURRING ============ -->
  <div id="page-recurring" hidden>
    <form class="intake" id="rintake" autocomplete="off">
      <input type="text" id="r-title" placeholder="What repeats?" required maxlength="140">
      <select id="r-cad" aria-label="How often"></select>
      <select id="r-imp" aria-label="Importance">
        <option value="3">Importance 3</option>
        <option value="2" selected>Importance 2</option>
        <option value="1">Importance 1</option>
      </select>
      <input type="date" id="r-next" aria-label="Next due" required>
      <button type="submit" class="file-btn">Add</button>
    </form>
    <div class="sched" id="sched"></div>
  </div>

  <p class="footnote" id="foot">Loading board…</p>
</div>

<script>
const LANES=[
  {id:"URGENT",  label:"Urgent / ad hoc",    note:"Do it next"},
  {id:"EARNINGS",label:"Earnings / event",    note:"Fixed date, can't slip"},
  {id:"QUICK",   label:"Quick wins",          note:"Under 60 minutes"},
  {id:"DEEP",    label:"Deep work",           note:"1–3 hours"},
  {id:"DEEPER",  label:"Deeper work",         note:"Half a day or more"},
  {id:"MODEL",   label:"Modeling",            note:"Build or update a model"},
  {id:"PROCESS", label:"Process improvement", note:"Makes future work faster"},
  {id:"OTHER",   label:"Other",               note:"Doesn't fit above"}
];
const CADENCES=[
  {id:"weekly",   label:"Weekly",    days:7},
  {id:"biweekly", label:"Every 2 weeks", days:14},
  {id:"monthly",  label:"Monthly",   days:30},
  {id:"quarterly",label:"Quarterly", days:91},
  {id:"annual",   label:"Annual",    days:365}
];
const KEY="deskboard:v3";
const DAY=864e5;
let state={tasks:[],recur:[]}, sort="heat", showDone=false, view="board", saveTimer=null;

/* ---------- storage: first backend that works wins ---------- */
let store=null;
const stores={
  artifact:{
    label:"this chat",
    ok:async()=>{ if(!window.storage||!window.storage.set) return false;
      try{ await window.storage.set(KEY+":probe","1"); return true; }catch(e){ return false; } },
    read:async()=>{ try{ const r=await window.storage.get(KEY); return r&&r.value; }catch(e){ return null; } },
    write:async v=>{ await window.storage.set(KEY,v); }
  },
  local:{
    label:"this browser",
    ok:async()=>{ try{ localStorage.setItem(KEY+":probe","1"); localStorage.removeItem(KEY+":probe"); return true; }
                  catch(e){ return false; } },
    read:async()=>localStorage.getItem(KEY),
    write:async v=>{ localStorage.setItem(KEY,v); }
  },
  memory:{ label:"nowhere", ok:async()=>true, read:async()=>null, write:async()=>{} }
};

async function load(){
  for(const k of ["artifact","local","memory"]){
    if(await stores[k].ok()){ store=stores[k]; break; }
  }
  /* v2 boards saved under the old key; read it once so nothing is lost */
  try{
    let raw=await store.read();
    if(!raw){
      try{ const old=await (store===stores.local
              ? Promise.resolve(localStorage.getItem("deskboard:v2"))
              : window.storage.get("deskboard:v2").then(r=>r&&r.value));
           if(old) raw=old; }catch(e){}
    }
    if(raw){ const p=JSON.parse(raw);
      if(Array.isArray(p.tasks)) state.tasks=p.tasks;
      if(Array.isArray(p.recur)) state.recur=p.recur; }
  }catch(e){}
  migrate();
  foot(store===stores.memory
    ? "This browser is blocking storage, so nothing saves. Use Export before you close the tab."
    : "Saving to "+store.label+". Export a backup before moving or renaming this file.");
}
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{ await store.write(JSON.stringify(state)); }
    catch(e){ foot("Changes stopped saving. Use Export to keep your board."); }
  },250);
}
function foot(m){document.getElementById("foot").textContent=m;}

/* Retired lanes get remapped instead of silently emptying. */
function migrate(){
  const valid=new Set(LANES.map(L=>L.id));
  const renamed={BLOCKED:"DEEPER",LATER:"OTHER",ROUTINE:"OTHER",ADHOC:"URGENT"};
  state.tasks.forEach(t=>{
    if(renamed[t.lane]) t.lane=renamed[t.lane];
    if(!valid.has(t.lane)) t.lane="OTHER";
    if(!(t.imp>=1&&t.imp<=3)) t.imp=2;
  });
  state.recur.forEach(r=>{ if(!(r.imp>=1&&r.imp<=3)) r.imp=2; });
}

/* ---------- backup ---------- */
function exportBoard(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="desk-board-"+ymd(new Date())+".json";
  a.click();
  URL.revokeObjectURL(a.href);
}
function importBoard(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const p=JSON.parse(fr.result);
      if(!Array.isArray(p.tasks)&&!Array.isArray(p.recur)) throw 0;
      let n=0;
      ["tasks","recur"].forEach(k=>{
        if(!Array.isArray(p[k])) return;
        const have=new Set(state[k].map(x=>x.id));
        p[k].forEach(x=>{ if(x&&x.id&&!have.has(x.id)){ state[k].push(x); n++; } });
      });
      migrate(); save(); render();
      foot("Imported "+n+" item"+(n===1?"":"s")+". Duplicates were skipped.");
    }catch(e){ foot("That file isn't a Desk Board export."); }
  };
  fr.onerror=()=>foot("Couldn't read that file.");
  fr.readAsText(file);
}

/* ---------- time ---------- */
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function endOf(iso){const[y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d,23,59,59).getTime();}
function ageMs(t){return Date.now()-t.assigned;}
function dueMs(t){return t.due? endOf(t.due)-Date.now() : null;}
function span(ms){
  const d=Math.floor(ms/DAY), h=Math.floor(ms%DAY/36e5), m=Math.floor(ms%36e5/6e4);
  if(d>0) return d+"d "+h+"h";
  if(h>0) return h+"h "+m+"m";
  return Math.max(m,0)+"m";
}
function dueText(t){
  const ms=dueMs(t);
  if(ms===null) return {txt:"no deadline",cls:"none"};
  if(ms<0) return {txt:span(-ms)+" overdue",cls:"late"};
  if(ms<DAY) return {txt:"due today · "+span(ms)+" left",cls:"soon"};
  if(ms<2*DAY) return {txt:"due tomorrow",cls:"soon"};
  return {txt:"in "+Math.floor(ms/DAY)+"d",cls:""};
}
/* Long forms are kept for tooltips; these compact forms share one line in a 124px lane. */
function ageShort(t){
  const ms=ageMs(t), d=Math.floor(ms/DAY);
  if(d>0) return d+"D ON DESK";
  const h=Math.floor(ms/36e5);
  return (h>0?h+"H":Math.max(Math.floor(ms/6e4),0)+"M")+" ON DESK";
}
function dueShort(t){
  const ms=dueMs(t);
  if(ms===null) return {txt:"NO DATE",cls:"none"};
  if(ms<0) return {txt:Math.ceil(-ms/DAY)+"D LATE",cls:"late"};
  if(ms<DAY) return {txt:"TODAY",cls:"soon"};
  return {txt:"IN "+Math.floor(ms/DAY)+"D",cls:ms<2*DAY?"soon":""};
}
/* Deadline proximity leads; importance shifts a task by roughly four days
   of urgency, and age lifts work that has no deadline at all. */
function heat(t){
  const age=ageMs(t)/DAY, ms=dueMs(t), bonus=((t.imp||2)-2)*120;
  if(ms===null) return age*(t.imp||2)+bonus/6;
  if(ms<0) return 1e4+(-ms/DAY)*20+age+bonus;
  return 5e3-(ms/DAY)*30+age*2+bonus;
}
function dots(level){
  const n=level||2;
  return `<span class="imp l${n}" role="img" aria-label="Importance ${n} of 3">`+
    [1,2,3].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")+`</span>`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ---------- recurring maths ---------- */
function advance(iso,cad){
  const[y,m,d]=iso.split("-").map(Number);
  const dt=new Date(y,m-1,d);
  if(cad==="weekly")        dt.setDate(dt.getDate()+7);
  else if(cad==="biweekly") dt.setDate(dt.getDate()+14);
  else if(cad==="monthly")  dt.setMonth(dt.getMonth()+1);
  else if(cad==="quarterly")dt.setMonth(dt.getMonth()+3);
  else                      dt.setFullYear(dt.getFullYear()+1);
  return ymd(dt);
}
function nextMs(r){return endOf(r.next)-Date.now();}
function nextText(r){
  const ms=nextMs(r);
  if(ms<0)      return {txt:Math.ceil(-ms/DAY)+"d overdue",cls:"late"};
  if(ms<DAY)    return {txt:"due today",cls:"soon"};
  if(ms<2*DAY)  return {txt:"due tomorrow",cls:"soon"};
  if(ms<7*DAY)  return {txt:"in "+Math.floor(ms/DAY)+"d",cls:"soon"};
  return {txt:"in "+Math.floor(ms/DAY)+"d",cls:""};
}

/* ---------- render ---------- */
function render(){
  const now=new Date();
  document.getElementById("stamp").textContent=
    now.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"}).toUpperCase();
  view==="board"?renderBoard():renderSched();
  renderGauges();
}

function renderGauges(){
  let rows;
  if(view==="board"){
    const live=state.tasks.filter(t=>!t.done);
    const overdue=live.filter(t=>{const m=dueMs(t);return m!==null&&m<0}).length;
    const today=live.filter(t=>{const m=dueMs(t);return m!==null&&m>=0&&m<DAY}).length;
    const stale=live.filter(t=>ageMs(t)>7*DAY).length;
    rows=[["Overdue",overdue,overdue?"hot":""],["Due today",today,today?"warm":""],
          ["Sitting 7d+",stale,stale?"warm":""],["On board",live.length,""]];
  }else{
    const late=state.recur.filter(r=>nextMs(r)<0).length;
    const week=state.recur.filter(r=>{const m=nextMs(r);return m>=0&&m<7*DAY}).length;
    rows=[["Overdue",late,late?"hot":""],["Next 7 days",week,week?"warm":""],
          ["Tracked",state.recur.length,""]];
  }
  document.getElementById("gauges").innerHTML=rows
    .map(([l,v,c])=>`<div class="gauge ${c}"><b>${v}</b><span>${l}</span></div>`).join("");
}

function renderBoard(){
  document.getElementById("lanes").innerHTML=LANES.map(L=>{
    let rows=state.tasks.filter(t=>t.lane===L.id&&(showDone||!t.done));
    rows.sort((a,b)=>{
      if(a.done!==b.done) return a.done?1:-1;
      if(sort==="age") return a.assigned-b.assigned;
      if(sort==="imp") return (b.imp||2)-(a.imp||2)||heat(b)-heat(a);
      if(sort==="due"){
        const x=dueMs(a),y=dueMs(b);
        if(x===null&&y===null) return a.assigned-b.assigned;
        if(x===null) return 1; if(y===null) return -1;
        return x-y;
      }
      return heat(b)-heat(a);
    });
    const open=rows.filter(t=>!t.done).length;
    return `<section class="lane" data-lane="${L.id}">
      <div class="lane-head"><div><h2>${L.label}</h2><em>${L.note}</em></div><span class="n">${open}</span></div>
      ${rows.length?rows.map(card).join(""):`<p class="lane-empty">Nothing here.</p>`}
    </section>`;
  }).join("");
}

function card(t){
  const d=dueText(t), ds=dueShort(t), ms=dueMs(t), days=Math.floor(ageMs(t)/DAY);
  const shown=Math.min(days,21);
  let ticks="";
  for(let i=0;i<shown;i++) ticks+=`<i class="${i>=7?"week":""}" style="height:${6+Math.min(i,13)*.65}px"></i>`;
  if(days>21) ticks+=`<span class="over">+${days-21}</span>`;
  if(days===0) ticks=`<span class="fresh">FILED TODAY</span>`;

  let rail;
  if(ms===null){ rail=`<div class="rail open"></div>`; }
  else{
    const total=endOf(t.due)-t.assigned;
    const pct=total>0?Math.min(100,Math.max(2,(ageMs(t)/total)*100)):100;
    rail=`<div class="rail ${d.cls}"><span style="width:${ms<0?100:pct}%"></span></div>`;
  }
  const opts=LANES.map(L=>`<option value="${L.id}"${L.id===t.lane?" selected":""}>${L.label}</option>`).join("");
  const imps=[3,2,1].map(n=>`<option value="${n}"${n===(t.imp||2)?" selected":""}>${n}</option>`).join("");

  return `<article class="task imp${t.imp||2} ${t.done?"done":d.cls==="late"?"late":d.cls==="soon"?"today":""}">
    <div class="task-top">
      <button class="check" data-done="${t.id}" aria-label="Mark finished">${t.done?"✓":""}</button>
      <h3>${esc(t.title)}</h3>
      ${dots(t.imp)}
      <button class="kill" data-kill="${t.id}" aria-label="Delete task">×</button>
    </div>
    <div class="tally" title="One mark per day since you added it">${ticks}</div>
    <div class="readout">
      <span title="On desk ${span(ageMs(t))}">${ageShort(t)}</span>
      <span class="due ${ds.cls}" title="${d.txt}">${ds.txt}</span>
    </div>
    ${rail}
    ${t.done?"":`<div class="move">
      <select class="lane" data-move="${t.id}" aria-label="Move to another category">${opts}</select>
      <select class="lvl" data-imp="${t.id}" aria-label="Importance, 1 to 3">${imps}</select>
    </div>`}
  </article>`;
}

function renderSched(){
  const host=document.getElementById("sched");
  if(!state.recur.length){
    host.innerHTML=`<p class="lane-empty">Nothing recurring yet. Add the things you redo every week, month, or quarter — the board only tracks one-offs.</p>`;
    return;
  }
  host.innerHTML=CADENCES.map(C=>{
    const rows=state.recur.filter(r=>r.cad===C.id).sort((a,b)=>nextMs(a)-nextMs(b));
    if(!rows.length) return "";
    const late=rows.filter(r=>nextMs(r)<0).length;
    return `<section class="sched-group">
      <h2>${C.label}<span>${rows.length} tracked${late?" · "+late+" overdue":""}</span></h2>
      ${rows.map(recRow).join("")}
    </section>`;
  }).join("");
}

function recRow(r){
  const n=nextText(r);
  const last=r.lastDone
    ? "last done "+span(Date.now()-r.lastDone)+" ago"
    : "never done";
  const count=r.count?" · "+r.count+"×":"";
  return `<article class="rec imp${r.imp||2} ${n.cls}">
    <div class="rec-name">
      <h3>${esc(r.title)}</h3>
      ${dots(r.imp)}
    </div>
    <div class="rec-when"><b class="${n.cls}">${n.txt.toUpperCase()}</b>${r.next}</div>
    <div class="rec-log">${last}${count}</div>
    <div class="rec-acts">
      <button class="primary" data-rdone="${r.id}">Done</button>
      <button data-rsend="${r.id}">To board</button>
      <button class="kill" data-rkill="${r.id}" aria-label="Delete">×</button>
    </div>
  </article>`;
}

/* ---------- populate selects ---------- */
document.getElementById("f-lane").innerHTML=
  LANES.map(L=>`<option value="${L.id}"${L.id==="QUICK"?" selected":""}>${L.label}</option>`).join("");
document.getElementById("r-cad").innerHTML=
  CADENCES.map(C=>`<option value="${C.id}"${C.id==="quarterly"?" selected":""}>${C.label}</option>`).join("");
document.getElementById("r-next").value=ymd(new Date());

/* ---------- events ---------- */
document.getElementById("intake").addEventListener("submit",e=>{
  e.preventDefault();
  const ti=document.getElementById("f-title"), du=document.getElementById("f-due");
  const title=ti.value.trim(); if(!title) return;
  state.tasks.push({id:uid(),title,
    lane:document.getElementById("f-lane").value,
    imp:+document.getElementById("f-imp").value,
    due:du.value||null,assigned:Date.now(),done:false});
  ti.value="";du.value="";ti.focus();save();render();
});

document.getElementById("rintake").addEventListener("submit",e=>{
  e.preventDefault();
  const ti=document.getElementById("r-title"), nx=document.getElementById("r-next");
  const title=ti.value.trim(); if(!title||!nx.value) return;
  state.recur.push({id:uid(),title,
    cad:document.getElementById("r-cad").value,
    imp:+document.getElementById("r-imp").value,
    next:nx.value,lastDone:null,count:0});
  ti.value="";ti.focus();save();render();
});
function uid(){return Date.now()+"-"+Math.random().toString(36).slice(2,7);}

document.getElementById("lanes").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.done){const x=state.tasks.find(t=>t.id===b.dataset.done); x.done=!x.done;}
  else if(b.dataset.kill){state.tasks=state.tasks.filter(t=>t.id!==b.dataset.kill);}
  else return;
  save();render();
});
document.getElementById("lanes").addEventListener("change",e=>{
  const s=e.target.closest("select"); if(!s) return;
  const id=s.dataset.move||s.dataset.imp;
  const x=state.tasks.find(t=>t.id===id); if(!x) return;
  if(s.dataset.move) x.lane=s.value; else x.imp=+s.value;
  save();render();
});

document.getElementById("sched").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.rdone){
    const r=state.recur.find(x=>x.id===b.dataset.rdone);
    r.lastDone=Date.now(); r.count=(r.count||0)+1;
    /* roll forward past any occurrences that already lapsed */
    let guard=0;
    do{ r.next=advance(r.next,r.cad); }while(endOf(r.next)<Date.now()&&++guard<200);
  }
  else if(b.dataset.rsend){
    const r=state.recur.find(x=>x.id===b.dataset.rsend);
    state.tasks.push({id:uid(),title:r.title,lane:"OTHER",imp:r.imp,
      due:r.next,assigned:Date.now(),done:false});
    foot("“"+r.title+"” filed under Other on the board, due "+r.next+".");
  }
  else if(b.dataset.rkill){ state.recur=state.recur.filter(x=>x.id!==b.dataset.rkill); }
  else return;
  save();render();
});

document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{
  view=b.dataset.view;
  document.querySelectorAll("[data-view]").forEach(o=>o.setAttribute("aria-selected",o===b));
  document.getElementById("page-board").hidden=view!=="board";
  document.getElementById("page-recurring").hidden=view!=="recurring";
  document.getElementById("tabnote").textContent=view==="board"
    ? "One-off work. Marks show days since you added it."
    : "The schedule. Completing a job rolls it to the next date.";
  render();
}));

document.querySelectorAll("[data-sort]").forEach(b=>b.addEventListener("click",()=>{
  sort=b.dataset.sort;
  document.querySelectorAll("[data-sort]").forEach(o=>o.setAttribute("aria-pressed",o===b));
  render();
}));
document.getElementById("t-done").addEventListener("click",e=>{
  showDone=!showDone; e.currentTarget.setAttribute("aria-pressed",showDone); render();
});
document.getElementById("b-export").addEventListener("click",exportBoard);
document.getElementById("b-import").addEventListener("click",()=>document.getElementById("f-import").click());
document.getElementById("f-import").addEventListener("change",e=>{
  if(e.target.files[0]) importBoard(e.target.files[0]);
  e.target.value="";
});

document.getElementById("tabnote").textContent="One-off work. Marks show days since you added it.";
setInterval(render,60000);
load().then(render);
</script>
